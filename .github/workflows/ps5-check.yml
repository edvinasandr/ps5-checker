# Save as .github/workflows/ps5-check.yml
name: PS5 Pro stock check
on:
  # Started by cron-job.org via the GitHub API, or manually with "Run workflow".
  workflow_dispatch:
    inputs:
      group:
        description: "Which stores to check"
        type: choice
        options: [all, ps, free, mms, proxy]
        default: all
      report:
        description: "Only send a report to Telegram (no checks)"
        type: choice
        options: [none, this hour, last hour, today, yesterday]
        default: none
      ps_test_url:
        description: "Test only: a PlayStation product page to read (no checks run)"
        type: string
        default: ""
      mms_test_product:
        description: "Test only: MediaMarkt/Saturn product number for a cart test (e.g. 2896393)"
        type: string
        default: ""
      test_alert:
        description: "Send a Telegram test message"
        type: boolean
        default: false
      debug:
        description: "Save downloaded pages for troubleshooting"
        type: boolean
        default: false

# Each group runs one at a time (a new PlayStation run waits for the running loop);
# different groups run in parallel
concurrency:
  group: ps5-${{ inputs.group || 'all' }}
  cancel-in-progress: false

permissions:
  contents: write   # lets the workflow commit restocks.csv

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 9   # the PlayStation loop runs ~5.5 min
    env:
      GROUP: ${{ inputs.group || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi

      - name: Run checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OXYLABS_USER: ${{ secrets.OXYLABS_USER }}
          OXYLABS_PASS: ${{ secrets.OXYLABS_PASS }}
          OXY_API_USER: ${{ secrets.OXY_API_USER }}
          OXY_API_PASS: ${{ secrets.OXY_API_PASS }}
          OXY_WEB_API_KEY: ${{ secrets.OXY_WEB_API_KEY }}
          MMS_ADDRESS: ${{ secrets.MMS_ADDRESS }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          PSDIRECT_URL: ${{ vars.PSDIRECT_URL }}
          MAX_PRICE: "900"
          # must match the cron jobs on cron-job.org
          FREE_EVERY_MIN: "1"     # Alternate, Müller
          MMS_EVERY_MIN: "2"      # MediaMarkt, Saturn
          PROXY_EVERY_MIN: "5"    # Amazon, expert
          PS_EVERY_SEC: "20"      # PlayStation check interval inside one run
          PS_LOOP_SEC: "330"      # how long one PlayStation run keeps checking (cron: every 5 min)
          PS_WEBAPI_MAX: "6"      # max Web API fallbacks per PlayStation run (after Sony 403s)
          AMAZON_EVERY_MIN: "5"   # Amazon interval (at least the proxy interval)
          STORE_GROUP: ${{ env.GROUP }}
          TEST_ALERT: ${{ inputs.test_alert }}
          DEBUG: ${{ inputs.debug }}
          REPORT: ${{ inputs.report }}
          PS_TEST_URL: ${{ inputs.ps_test_url }}
          MMS_TEST_PRODUCT: ${{ inputs.mms_test_product }}
        run: python -u ps5_checker.py

      - name: Save restock history to repo
        if: always()
        run: |
          if [ -f restocks.csv ] && [ -n "$(git status --porcelain restocks.csv)" ]; then
            git config user.name "ps5-checker-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add restocks.csv
            git commit -m "Restock history update"
            # the other group may have pushed at the same time: retry
            for i in 1 2 3; do
              git pull --rebase && git push && break
              sleep 3
            done
          fi

      - name: Upload debug pages
        if: always() && inputs.debug
        uses: actions/upload-artifact@v4
        with:
          name: debug-pages
          path: debug/
          if-no-files-found: ignore
